worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging ──────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # ── Performance ──────────────────────────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 50m;

  # ── Compression ──────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript
             application/vnd.ms-fontobject application/x-font-ttf
             font/opentype image/svg+xml image/x-icon;

  # ── Security Headers ─────────────────────────────────────
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  server_tokens off;

  # ── Rate Limiting ────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

  # ── Upstream ─────────────────────────────────────────────
  upstream seahawk_api {
    server app:3001;
    keepalive 32;
  }

  # ── HTTP → HTTPS redirect ────────────────────────────────
  server {
    listen 80;
    server_name seahawkcourier.in www.seahawkcourier.in;

    # ACME challenge (for Let's Encrypt)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── Main HTTPS server ────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name seahawkcourier.in www.seahawkcourier.in;

    # ── SSL ────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Public Marketing Website ───────────────────────────
    root /var/www/website;
    index index.html;

    location / {
      try_files $uri $uri.html $uri/ =404;
      expires 1d;
      add_header Cache-Control "public, no-transform";
    }

    # Static assets (long cache)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|webp|svg|woff|woff2)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # ── Client Portal (React SPA) ─────────────────────────
    location /portal/ {
      alias /var/www/portal/;
      try_files $uri $uri/ /portal/index.html;
      expires 0;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── API Proxy ─────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=50 nodelay;

      proxy_pass http://seahawk_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 90s;
      proxy_connect_timeout 10s;
    }

    # Strict rate limit for login
    location /api/auth/login {
      limit_req zone=login burst=3 nodelay;
      proxy_pass http://seahawk_api;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── 404 ───────────────────────────────────────────────
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
  }

  # ── Dev server (no SSL) ──────────────────────────────────
  server {
    listen 80 default_server;
    server_name localhost 127.0.0.1;
    root /var/www/website;
    index index.html;

    location / { try_files $uri $uri.html $uri/ =404; }
    location /portal/ { alias /var/www/portal/; try_files $uri $uri/ /portal/index.html; }
    location /api/ {
      proxy_pass http://seahawk_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
