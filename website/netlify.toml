# netlify-website.toml — For the MARKETING WEBSITE deployment
# This is for deploying just the website/ folder to Netlify
#
# If you want website + portal on same Netlify site:
# → Rename this to netlify.toml and place in /website folder
# → Or use the main netlify.toml (portal) and deploy website separately

[build]
  base    = "website"
  command = "echo 'Static site — no build needed'"
  publish = "."

[[redirects]]
  from   = "/portal"
  to     = "https://your-portal.netlify.app/portal"
  status = 301

[[redirects]]
  from   = "/portal/*"
  to     = "https://your-portal.netlify.app/portal/:splat"
  status = 301

# No 404 page yet — serve index.html for any unknown path
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Cache-Control          = "public, max-age=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
