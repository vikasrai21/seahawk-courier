version: '3.9'

# ══════════════════════════════════════════════════════
#  Sea Hawk Courier — Docker Compose
#  Usage:
#    Dev:  docker-compose up -d
#    Prod: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ══════════════════════════════════════════════════════

services:

  # ── PostgreSQL Database ────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: seahawk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       seahawk_v6
      POSTGRES_USER:     seahawk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changethis_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seahawk -d seahawk_v6"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seahawk

  # ── Redis (for sessions, rate limiting, caching) ───
  redis:
    image: redis:7-alpine
    container_name: seahawk-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changethis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seahawk

  # ── Backend API ────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: seahawk-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:           production
      PORT:               3001
      DATABASE_URL:       postgresql://seahawk:${DB_PASSWORD:-changethis_in_production}@db:5432/seahawk_v6
      REDIS_URL:          redis://:${REDIS_PASSWORD:-changethis}@redis:6379
      JWT_SECRET:         ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CORS_ORIGIN:        ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3001:3001"
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    networks:
      - seahawk

  # ── Nginx Reverse Proxy ────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: seahawk-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./website:/var/www/website:ro
      - ./frontend/dist:/var/www/portal:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - seahawk

volumes:
  postgres_data:
    name: seahawk_postgres_data
  redis_data:
    name: seahawk_redis_data
  nginx_logs:

networks:
  seahawk:
    name: seahawk_network
